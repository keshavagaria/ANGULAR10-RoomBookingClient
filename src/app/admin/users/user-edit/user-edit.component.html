<h1>{{user.id == null ? 'Add' : 'Edit'}} User</h1>

<div class="bg-warning p-5" *ngIf="message">{{message}}</div>

<form #userForm="ngForm">

  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" class="form-control" id="name" placeholder="user name" [(ngModel)]="formUser.name"
     name="name" required #nameField="ngModel" (change)="checkNameValidity()">
    <div class="alert alert-danger" *ngIf="nameField.invalid && nameField.touched">Name is required</div>
    <div class="alert alert-danger" *ngIf="!isNameValid && nameField.touched">Name cannot be empty</div>

  </div>

  <div class="form-group" *ngIf="user.id == null"> <!-- only show this field on adding a user -->
    <label for="password">Password</label>
    <input type="password" class="form-control" id="password"  placeholder="password" name="password"
    [(ngModel)]="password" (change)="checkPasswordValidityAndMatch()" required #pass1="ngModel">
    <div class="alert alert-danger" [hidden]="pass1.valid || pass1.untouched">Password is Required</div>
    <div class="alert alert-danger" [hidden]="ArePasswordsValid || pass1.untouched">Password cannot be blank</div>

    <label for="password2">Repeat Password</label>
    <input type="password" class="form-control" id="password2"  placeholder="repeat password" name="password2"
     [(ngModel)]="password2" (change)="checkPasswordValidityAndMatch()" required #pass2="ngModel">
    <div class="alert alert-danger" [hidden]="ArePasswordsMatch || pass2.untouched">Password must match</div>

  </div>

  <button type="button" class="btn btn-primary" (click)="onSubmit()"
  [disabled]="userForm.invalid || !isNameValid || !ArePasswordsMatch">Save</button>
</form>
